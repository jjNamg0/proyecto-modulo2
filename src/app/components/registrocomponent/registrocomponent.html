<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card card-auth p-4">
        <h1 class="h4 text-white mb-4 text-center">
          <i class="fa-solid fa-user-plus me-2"></i>{{ traducir('auth.crearCuenta') }}
        </h1>

        <div class="mb-3">
          <label class="form-label small text-secondary" for="nombreRegistro">{{ traducir('auth.nombreCompleto') }}</label>
          <input
            id="nombreRegistro"
            type="text"
            class="form-control"
            [placeholder]="traducir('auth.tuNombre')"
            [(ngModel)]="nombre"
          />
        </div>

        <div class="mb-3">
          <label class="form-label small text-secondary" for="correoRegistro">{{ traducir('auth.correo') }}</label>
          <input
            id="correoRegistro"
            type="email"
            class="form-control"
            [placeholder]="traducir('auth.correoPlaceholder')"
            [(ngModel)]="correo"
          />
        </div>

        <div class="mb-3">
          <label class="form-label small text-secondary" for="passwordRegistro">{{ traducir('auth.password') }}</label>
          <input
            id="passwordRegistro"
            type="password"
            class="form-control"
            placeholder="••••••••"
            [(ngModel)]="password"
          />
        </div>

        <div class="alert alert-warning small py-2 mb-3" role="alert" *ngIf="errorRegistro">
          <i class="fa-solid fa-triangle-exclamation me-1"></i>{{ errorRegistro }}
        </div>

        <button type="button" class="btn btn-primary w-100 mb-3" (click)="registrar()">
          <i class="fa-solid fa-user-plus me-1"></i>{{ traducir('auth.crearCuenta') }}
        </button>

        <p class="text-center small text-secondary mb-0">
          {{ traducir('auth.yaTienesCuenta') }} <a routerLink="/login" queryParamsHandling="preserve">{{ traducir('auth.iniciaSesion') }}</a>
        </p>
      </div>
    </div>
  </div>
</section>
