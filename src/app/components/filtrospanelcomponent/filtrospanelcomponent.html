<div class="filtros-panel p-3">
  <h2 class="h6 text-white mb-3">
    <i class="fa-solid fa-sliders me-2"></i>{{ traducir('filtros.titulo') }}
  </h2>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroTexto">{{ traducir('filtros.buscar') }}</label>
    <div class="input-group input-group-sm">
      <span class="input-group-text">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>
      <input
        id="filtroTexto"
        type="search"
        class="form-control"
        [placeholder]="traducir('filtros.buscarPlaceholder')"
        [(ngModel)]="filtros.texto"
        (ngModelChange)="emitirCambio()"
      />
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroPais">{{ traducir('filtros.pais') }}</label>
    <select
      id="filtroPais"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.pais"
      (ngModelChange)="cambiarPais()"
    >
      <option value="">{{ traducir('filtros.todosPaises') }}</option>
      <option *ngFor="let pais of paises" [value]="pais">{{ pais }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroCiudad">{{ traducir('filtros.ciudad') }}</label>
    <select
      id="filtroCiudad"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.ciudad"
      (ngModelChange)="emitirCambio()"
    >
      <option value="">{{ traducir('filtros.todasCiudades') }}</option>
      <option *ngFor="let ciudad of ciudades" [value]="ciudad">{{ ciudad }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroHuespedes">{{ traducir('filtros.huespedes') }}</label>
    <input
      id="filtroHuespedes"
      type="number"
      min="1"
      class="form-control form-control-sm"
      [placeholder]="traducir('filtros.cualquierCantidad')"
      [(ngModel)]="filtros.huespedes"
      (ngModelChange)="emitirCambio()"
    />
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroTipo">{{ traducir('filtros.tipo') }}</label>
    <select
      id="filtroTipo"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.tipo"
      (ngModelChange)="emitirCambio()"
    >
      <option value="">{{ traducir('filtros.todosTipos') }}</option>
      <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroPrecio">{{ traducir('filtros.precioMaximo') }}</label>
    <input
      id="filtroPrecio"
      type="number"
      min="0"
      step="10000"
      class="form-control form-control-sm"
      [placeholder]="traducir('filtros.sinLimite')"
      [(ngModel)]="filtros.precioMaximo"
      (ngModelChange)="emitirCambio()"
    />
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroOrden">{{ traducir('filtros.ordenar') }}</label>
    <select
      id="filtroOrden"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.orden"
      (ngModelChange)="emitirCambio()"
    >
      <option value="">{{ traducir('filtros.recomendados') }}</option>
      <option value="precio-asc">{{ traducir('filtros.precioAsc') }}</option>
      <option value="precio-desc">{{ traducir('filtros.precioDesc') }}</option>
      <option value="calificacion-desc">{{ traducir('filtros.mejorCalificados') }}</option>
      <option value="nombre-asc">{{ traducir('filtros.nombreAsc') }}</option>
    </select>
  </div>

  <button type="button" class="btn btn-outline-light btn-sm w-100" (click)="limpiarFiltros()">
    <i class="fa-solid fa-rotate-left me-1"></i>{{ traducir('filtros.limpiar') }}
  </button>
</div>
