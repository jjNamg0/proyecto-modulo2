<div class="filtros-panel p-3">
  <h2 class="h6 text-white mb-3">
    <i class="fa-solid fa-sliders me-2"></i>Filtros
  </h2>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroCiudad">Ciudad</label>
    <select
      id="filtroCiudad"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.ciudad"
      (ngModelChange)="emitirCambio()"
    >
      <option value="">Todas las ciudades</option>
      <option *ngFor="let ciudad of ciudades" [value]="ciudad">{{ ciudad }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroHuespedes">Número de huéspedes</label>
    <input
      id="filtroHuespedes"
      type="number"
      min="1"
      class="form-control form-control-sm"
      placeholder="Cualquier cantidad"
      [(ngModel)]="filtros.huespedes"
      (ngModelChange)="emitirCambio()"
    />
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroTipo">Tipo de alojamiento</label>
    <select
      id="filtroTipo"
      class="form-select form-select-sm"
      [(ngModel)]="filtros.tipo"
      (ngModelChange)="emitirCambio()"
    >
      <option value="">Todos los tipos</option>
      <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label small text-secondary" for="filtroPrecio">Precio máximo por noche</label>
    <input
      id="filtroPrecio"
      type="number"
      min="0"
      step="10000"
      class="form-control form-control-sm"
      placeholder="Sin límite"
      [(ngModel)]="filtros.precioMaximo"
      (ngModelChange)="emitirCambio()"
    />
  </div>

  <button type="button" class="btn btn-outline-light btn-sm w-100" (click)="limpiarFiltros()">
    <i class="fa-solid fa-rotate-left me-1"></i>Limpiar filtros
  </button>
</div>
