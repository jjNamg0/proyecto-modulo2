<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
      <div class="card card-auth p-4">
        <h1 class="h4 text-white mb-4 text-center">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Iniciar sesión
        </h1>

        <div class="mb-3">
          <label class="form-label small text-secondary" for="correoLogin">Correo electrónico</label>
          <input
            id="correoLogin"
            type="email"
            class="form-control"
            placeholder="tucorreo@ejemplo.com"
            [(ngModel)]="correo"
          />
        </div>

        <div class="mb-3">
          <label class="form-label small text-secondary" for="passwordLogin">Contraseña</label>
          <input
            id="passwordLogin"
            type="password"
            class="form-control"
            placeholder="••••••••"
            [(ngModel)]="password"
          />
        </div>

        <div class="alert alert-warning small py-2 mb-3" role="alert" *ngIf="errorLogin">
          <i class="fa-solid fa-triangle-exclamation me-1"></i>{{ errorLogin }}
        </div>

        <button type="button" class="btn btn-primary w-100 mb-3" (click)="iniciarSesion()">
          <i class="fa-solid fa-right-to-bracket me-1"></i>Iniciar sesión
        </button>

        <p class="text-center small text-secondary mb-0">
          ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</section>
